name: Python application

on:
  push:
    branches: [ "main" ]
    paths:
      - 'hantavirus_dataset_raw.csv'
      - 'preprocessing/automate_Hanif-Jun.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'hantavirus_dataset_raw.csv'
      - 'preprocessing/automate_Hanif-Jun.py'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: "3.12.7"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas scikit-learn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: run automate preprocessing
      run: |
        python preprocessing/automate_Hanif-Jun.py

    - name: Commit and Push Preprocessed Data
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"

        # Menambahkan folder hasil keluaran ke staging area
        git add preprocessing/hantavirus_dataset_preprocessing/

        # Jika tidak ada perubahan data, lewati proses commit agar tidak error
        if git diff --staged --quiet; then
          echo "Tidak ada perubahan data baru hasil preprocessing. Skip commit."
        else
          git commit -m "Automated: Update hantavirus preprocessed data via GitHub Actions"
          git push
        fi

